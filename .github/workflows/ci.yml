name: CI

on:
  push:
  pull_request:

jobs:
  format-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Проверка форматирования
        run: make -C module2 format-check

      - name: Запуск тестов
        run: make -C module2 test