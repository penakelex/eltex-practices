name: CI

on:
  push:
  pull_request:

jobs:
  format-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка clang и clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format

      - name: Версии инструментов
        run: |
          clang --version
          clang-format --version

      - name: Проверка форматирования
        run: make format-check

      - name: Запуск тестов
        run: make test